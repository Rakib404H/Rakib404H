<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rakib Hossain">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="50%" stop-color="#0d1130"/>
      <stop offset="100%" stop-color="#0c1628"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="420" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Dot grid -->
  <g opacity="0.3">
    <circle cx="30" cy="30" r="1" fill="#334155"/>
    <circle cx="70" cy="30" r="1" fill="#334155"/>
    <circle cx="110" cy="30" r="1" fill="#334155"/>
    <circle cx="150" cy="30" r="1" fill="#334155"/>
    <circle cx="190" cy="30" r="1" fill="#334155"/>
    <circle cx="30" cy="60" r="1" fill="#334155"/>
    <circle cx="70" cy="60" r="1" fill="#334155"/>
    <circle cx="110" cy="60" r="1" fill="#334155"/>
    <circle cx="150" cy="60" r="1" fill="#334155"/>
    <circle cx="190" cy="60" r="1" fill="#334155"/>
    <circle cx="230" cy="60" r="1" fill="#334155"/>
    <circle cx="30" cy="90" r="1" fill="#334155"/>
    <circle cx="70" cy="90" r="1" fill="#334155"/>
    <circle cx="110" cy="90" r="1" fill="#334155"/>
    <circle cx="150" cy="90" r="1" fill="#334155"/>
    <circle cx="190" cy="90" r="1" fill="#334155"/>
    <circle cx="230" cy="90" r="1" fill="#334155"/>
    <circle cx="270" cy="90" r="1" fill="#334155"/>
  </g>

  <!-- Decorative orbs -->
  <circle cx="1020" cy="50" r="180" fill="url(#accent1)" opacity="0.05"/>
  <circle cx="1130" cy="250" r="130" fill="url(#accent2)" opacity="0.05"/>
  <circle cx="100" cy="290" r="80" fill="url(#accent1)" opacity="0.03"/>

  <!-- Accent bar -->
  <rect x="64" y="78" width="4" height="144" rx="2" fill="url(#accent1)"/>

  <!-- Top line -->
  <rect x="86" y="78" width="200" height="1.5" rx="1" fill="url(#accent1)" opacity="0.25"/>

  <!-- Name -->
  <text x="86" y="128" fill="url(#nameGrad)" font-size="46" font-family="Segoe UI, Arial, sans-serif" font-weight="800" letter-spacing="-1">Rakib Hossain</text>

  <!-- Role -->
  <text x="88" y="166" fill="#818cf8" font-size="18" font-family="Segoe UI, Arial, sans-serif" font-weight="600" letter-spacing="4">ASPIRING CLOUD &amp; DEVOPS ENGINEER</text>

  <!-- Tagline -->
  <text x="88" y="198" fill="#94a3b8" font-size="14" font-family="Segoe UI, Arial, sans-serif" font-weight="400">Learning by building real infrastructure with AWS, Docker &amp; CI/CD</text>

  <!-- Bottom line -->
  <rect x="86" y="218" width="140" height="1.5" rx="1" fill="url(#accent2)" opacity="0.35"/>

  <!-- Terminal window decoration -->
  <g opacity="0.12" transform="translate(770, 80)">
    <rect width="350" height="165" rx="10" fill="#1e1b4b" stroke="#4338ca" stroke-width="0.8"/>
    <rect width="350" height="28" rx="10" fill="#1e1b4b"/>
    <rect y="18" width="350" height="10" fill="#1e1b4b"/>
    <circle cx="18" cy="14" r="4.5" fill="#ef4444" opacity="0.7"/>
    <circle cx="34" cy="14" r="4.5" fill="#eab308" opacity="0.7"/>
    <circle cx="50" cy="14" r="4.5" fill="#22c55e" opacity="0.7"/>
    <text x="16" y="52" fill="#818cf8" font-size="12" font-family="Consolas, monospace">$ docker ps</text>
    <text x="16" y="74" fill="#22c55e" font-size="11" font-family="Consolas, monospace">CONTAINER   STATUS    PORTS</text>
    <text x="16" y="94" fill="#94a3b8" font-size="11" font-family="Consolas, monospace">web-app     Up 3h     :443</text>
    <text x="16" y="114" fill="#94a3b8" font-size="11" font-family="Consolas, monospace">api-svc     Up 3h     :8080</text>
    <text x="16" y="134" fill="#94a3b8" font-size="11" font-family="Consolas, monospace">nginx-lb    Up 3h     :80</text>
    <text x="16" y="155" fill="#818cf8" font-size="12" font-family="Consolas, monospace">$ _</text>
  </g>
</svg>
