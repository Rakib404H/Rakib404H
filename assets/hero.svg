<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rakib Hossain — Aspiring Cloud & DevOps Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="40%" stop-color="#0d1130"/>
      <stop offset="100%" stop-color="#0c1628"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>

  <!-- Decorative orbs -->
  <circle cx="1050" cy="60" r="160" fill="url(#accent1)" opacity="0.06"/>
  <circle cx="1140" cy="240" r="120" fill="url(#accent2)" opacity="0.06"/>
  <circle cx="150" cy="280" r="100" fill="url(#accent1)" opacity="0.04"/>

  <!-- Accent line -->
  <rect x="64" y="80" width="4" height="140" rx="2" fill="url(#accent1)" filter="url(#glow)"/>

  <!-- Top decorative bar -->
  <rect x="86" y="80" width="260" height="2" rx="1" fill="url(#accent1)" opacity="0.3"/>

  <!-- Name -->
  <text x="86" y="130" fill="url(#textGrad)" font-size="46" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-weight="800" letter-spacing="-1">Rakib Hossain</text>

  <!-- Role -->
  <text x="86" y="168" fill="#818cf8" font-size="20" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-weight="600" letter-spacing="3" text-transform="uppercase">ASPIRING CLOUD &amp; DEVOPS ENGINEER</text>

  <!-- Tagline -->
  <text x="86" y="200" fill="#94a3b8" font-size="15" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-weight="400">Building scalable infrastructure · AWS · Docker · Kubernetes · CI/CD</text>

  <!-- Bottom decorative bar -->
  <rect x="86" y="222" width="180" height="2" rx="1" fill="url(#accent2)" opacity="0.4"/>

  <!-- Terminal prompt decoration -->
  <g opacity="0.15" transform="translate(780, 90)">
    <rect width="340" height="160" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" opacity="0.4"/>
    <circle cx="20" cy="16" r="5" fill="#ef4444" opacity="0.6"/>
    <circle cx="36" cy="16" r="5" fill="#eab308" opacity="0.6"/>
    <circle cx="52" cy="16" r="5" fill="#22c55e" opacity="0.6"/>
    <text x="16" y="50" fill="#818cf8" font-size="12" font-family="'Cascadia Code', 'Fira Code', monospace">$ kubectl get pods</text>
    <text x="16" y="72" fill="#22c55e" font-size="12" font-family="'Cascadia Code', 'Fira Code', monospace">NAME         READY  STATUS</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12" font-family="'Cascadia Code', 'Fira Code', monospace">web-app      1/1    Running</text>
    <text x="16" y="112" fill="#94a3b8" font-size="12" font-family="'Cascadia Code', 'Fira Code', monospace">api-svc      1/1    Running</text>
    <text x="16" y="132" fill="#94a3b8" font-size="12" font-family="'Cascadia Code', 'Fira Code', monospace">redis-db     1/1    Running</text>
    <text x="16" y="152" fill="#818cf8" font-size="12" font-family="'Cascadia Code', 'Fira Code', monospace">$ _</text>
  </g>
</svg>
